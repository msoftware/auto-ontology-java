server {
  listen 80;
  root /usr/share/nginx/html;
  # Content-Security-Policy of the standalone app (NFR-SEC-05)
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'" always;
  location /api/ {
    proxy_pass http://backend:8080;
    # SSE: no buffering, long timeouts (NFR-PERF-01)
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_http_version 1.1;
  }
  location /mcp {
    proxy_pass http://backend:8080;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_http_version 1.1;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
