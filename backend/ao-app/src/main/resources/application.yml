# SPDX-License-Identifier: Apache-2.0
# Auto-Ontology standalone application. No authentication: operate only in an internal network (NFR-SEC-06).
server:
  # bootRun / JAR bind to localhost; the Docker image overrides this with 0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: auto-ontology
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:auto_ontology}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  mvc:
    async:
      # chat runs may take minutes (NFR-PERF-01)
      request-timeout: 1800s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

ao:
  api-prefix: ${AO_API_PREFIX:/api}
  vector:
    store: ${AO_VECTOR_STORE:qdrant}
    dimensions: ${AO_VECTOR_DIMENSIONS:2048}
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      api-key: ${QDRANT_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # correlation id per chat run and node (NFR-OBS-01)
    level: "%5p [run=%X{ao.run:-} node=%X{ao.node:-}]"
