ao.ingest.interval-hours=${INGEST_INTERVAL_HOURS:24}
ao.models.defaults.endpoint=${DEFAULT_MODELS_ENDPOINT:http://localhost:8888/v1}
ao.models.defaults.api-key=${DEFAULT_MODELS_API_KEY:sk-unsloth-a165ea524a8308c69ed607f9f4485d5b}
ao.models.defaults.model=${DEFAULT_MODELS_MODEL:jcbtc/qwen3.6-35b-a3b-crown-halo-mtp-dynamic:Qwen3.6-35B-A3B-HaloStrix-Dyn-MTP-v7}
ao.models.reasoning.endpoint=${REASONING_ENDPOINT:}
ao.models.reasoning.api-key=${REASONING_API_KEY:}
ao.models.reasoning.model=${REASONING_MODEL:}
ao.models.non-reasoning.endpoint=${NON_REASONING_ENDPOINT:}
ao.models.non-reasoning.api-key=${NON_REASONING_API_KEY:}
ao.models.non-reasoning.model=${NON_REASONING_MODEL:}
ao.models.embed.endpoint=${EMBED_ENDPOINT:}
ao.models.embed.api-key=${EMBED_API_KEY:}
ao.models.embed.model=${EMBED_MODEL:}
